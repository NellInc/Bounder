version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # init and analyze must move together: CodeQL refuses to analyse with an init
      # configuration from a different release, so split pull requests can never pass.
      codeql-action:
        patterns:
          - "github/codeql-action*"
