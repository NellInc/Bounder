name: Contract drift (producer derivation when token present)

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schemas/**"
      - "runtime/**"
      - "policy-roundtrip.js"
      - "simulator-contracts.js"
      - "scripts/verify-producer-derivation.mjs"
      - "scripts/lib/**"
      - "scripts/generate-release-manifest-v2.mjs"
      - "system/**"
      - "release/**"
      - "VERSION"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/receipt-drift.yml"
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The secrets context is not readable inside step conditions, so expose only whether the
      # private read token exists. The token itself is passed only to the producer checkout.
      PRODUCER_TOKEN_AVAILABLE: ${{ secrets.BOUNDER_PRODUCER_READ_TOKEN != '' }}
    steps:
      - name: Checkout publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: publisher
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: publisher/.nvmrc
          cache: npm
          cache-dependency-path: publisher/package-lock.json
      - name: Install publisher dependencies exactly
        working-directory: publisher
        run: npm ci --ignore-scripts
      - name: Validate local contracts and provenance tooling
        working-directory: publisher
        run: node --test tests/producer-derivation.test.js tests/release-manifest-v2.test.js
      # The newest sealed manifest is the single source of truth for which producer tree this
      # release claims. Resolving it here means a manifest bump moves the verified ref
      # automatically instead of leaving the workflow attesting to a superseded commit. This
      # step reads only public repository files, so it runs for fork pull requests too.
      - name: Resolve the producer commit named by the newest release manifest
        id: producer
        working-directory: publisher
        run: |
          set -euo pipefail
          node scripts/lib/release-producer.mjs
          echo "commit=$(node scripts/lib/release-producer.mjs --commit)" >> "$GITHUB_OUTPUT"
      - name: Checkout immutable producer input
        if: ${{ env.PRODUCER_TOKEN_AVAILABLE == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NellInc/Bounder-from-org
          ref: ${{ steps.producer.outputs.commit }}
          # Passed to this checkout only. A job-level env block would put the private producer
          # credential in the process environment of every step, including steps that execute
          # pull-request-head code, and persist-credentials: false stops checkout from leaving
          # it in producer/.git/config, where those same steps could read it. The later steps
          # only run local Git inspection in the producer tree and need no credential.
          token: ${{ secrets.BOUNDER_PRODUCER_READ_TOKEN }}
          path: producer
          persist-credentials: false
      - name: Regenerate producer evidence and compare exact bytes
        if: ${{ env.PRODUCER_TOKEN_AVAILABLE == 'true' }}
        working-directory: publisher
        run: npm run verify:producer -- --producer-root ../producer
      # A skipped derivation must not read as a passed one. The warning annotation and the job
      # summary make the unverified state visible next to the green contract checks.
      - name: Record unavailable private-producer proof
        if: ${{ env.PRODUCER_TOKEN_AVAILABLE != 'true' }}
        run: |
          message="Producer derivation is unverified in this run because BOUNDER_PRODUCER_READ_TOKEN is unavailable. Only the local contract and provenance checks ran. Release sealing must supply a current local producer receipt."
          echo "::warning title=Producer derivation unverified::${message}"
          printf '### Producer derivation unverified\n\n%s\n' "${message}" >> "$GITHUB_STEP_SUMMARY"
