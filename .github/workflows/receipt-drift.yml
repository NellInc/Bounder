name: Receipt contract and drift

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schemas/**"
      - "continuity-evidence.js"
      - "policy-roundtrip.js"
      - "simulator-bootstrap.js"
      - "simulator-contracts.js"
      - "simulator-fallback.js"
      - "simulator.html"
      - "simulator-world.js"
      - "simulator.js"
      - "staging-feed.js"
      - "release/**"
      - "VERSION"
      - "scripts/generate-release-manifest.js"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/receipt-drift.yml"
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Compare receipts and schemas with the pinned canonical release
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          version="$(tr -d '[:space:]' < VERSION)"
          manifest="release/bounder-reference-v${version}.manifest.json"
          IFS=$'\t' read -r canonical_repository canonical_commit < <(node - "$manifest" <<'NODE'
          const { readFileSync } = require("node:fs");

          const manifest = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const repository = new URL(manifest.canonical_interlock.repository);
          const repositoryPath = repository.pathname.replace(/^\/+|\/+$/g, "");
          const commit = manifest.canonical_interlock.commit;

          if (repository.protocol !== "https:" || repository.hostname !== "github.com") {
            throw new Error("canonical_interlock.repository must be an HTTPS GitHub URL");
          }
          if (!/^[^/]+\/[^/]+$/.test(repositoryPath)) {
            throw new Error("canonical_interlock.repository must identify one GitHub repository");
          }
          if (manifest.canonical_interlock.ref !== "main") {
            throw new Error("canonical_interlock.ref must be main");
          }
          if (!/^[0-9a-f]{40}$/.test(commit)) {
            throw new Error("canonical_interlock.commit must be a full Git commit SHA");
          }

          console.log(`${repositoryPath}\t${commit}`);
          NODE
          )
          node --input-type=module - "$manifest" "$tmp/pinned-evidence-paths" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { pinnedEvidenceAndSchemaPaths } from "./scripts/generate-release-manifest.js";

          const manifest = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const paths = pinnedEvidenceAndSchemaPaths(manifest);
          writeFileSync(process.argv[3], `${paths.join("\n")}\n`, { flag: "wx" });
          NODE

          base="https://raw.githubusercontent.com/${canonical_repository}/${canonical_commit}"
          nonce="$(date +%s)"
          while IFS= read -r path; do
            mkdir -p "$tmp/$(dirname "$path")"
            curl -fsSL --retry 4 --retry-all-errors "$base/$path?cache=$nonce" -o "$tmp/$path"
            cmp "$path" "$tmp/$path"
          done < "$tmp/pinned-evidence-paths"
