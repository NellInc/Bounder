name: Site quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Deterministic design lint
        run: npx --yes impeccable@3.2.1 detect .
      - name: Assemble the allowlisted public artifact
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
