<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Bounder</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to Bounder's homepage for drone geofencing solutions.">
  <link rel="canonical" href="https://www.bounder.io/404.html">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #11130f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }
    .container { max-width: 600px; }
    .logo { width: 200px; height: auto; margin-bottom: 40px; filter: brightness(0) invert(1); }
    .error-code {
      font-size: 120px;
      font-weight: 700;
      line-height: 1;
      color: #c9ff57;
      margin-bottom: 20px;
    }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: 32px; font-weight: 600; margin-bottom: 16px; color: #ffffff; }
    p { font-size: 16px; color: #d1d5db; margin-bottom: 32px; line-height: 1.6; }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #c9ff57;
      color: #11130f;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); }
    .links { margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
    .links a { color: #c9ff57; text-decoration: none; margin: 0 16px; font-size: 14px; }
    .links a:hover { text-decoration: underline; }
    @media (max-width: 480px) {
      .error-code { font-size: 80px; }
      h1 { font-size: 22px; }
      .logo { width: 150px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="assets/images/logo.png" alt="Bounder" class="logo">
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <a href="/" class="btn">Return to Homepage</a>
    <div class="links">
      <a href="contact.html">Contact Us</a>
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </div>
  </div>
</body>
</html>
